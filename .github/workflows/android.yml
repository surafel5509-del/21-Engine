name: Android CI

on:
  push:
    branches:
      - master
      - 'arena/**'
  pull_request:

permissions:
  contents: read

jobs:
  engine-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include the Android SDK and command-line tools.
      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :engine:test :app:assembleDebug --stacktrace 2>&1 | tee /tmp/sengine-gradle.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            # A short annotation is accessible even when CI log downloads are unavailable.
            details=$(tail -n 45 /tmp/sengine-gradle.log)
            details=${details//\%/\%25}
            details=${details//$'\r'/\%0D}
            details=${details//$'\n'/\%0A}
            printf '::error title=Gradle build output::%s\n' "$details"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: s-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  web-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline web player tests
        run: node --test web/tests/*.test.js
